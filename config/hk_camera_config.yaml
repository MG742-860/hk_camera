# 影像类参数（加载到节点私有命名空间 /hk_camera/hk_camera，顶层键必须是 hk_camera）。
# 与 launch 里的同名参数不要重复定义：重复且取值不同时以本文件为准，启动日志会告警并列出冲突键。
#
# 像素格式固定 RG8(BayerRG8)，原因（2026-09 实测，MV-CS016-10UC @1440x1080）：
#   BayerRG8 165.369fps / PayloadSize 1555200   ← 现用，Gamma 三个节点不可写(0x80000106)
#   RGB8、BGR8 79.227fps / PayloadSize 4665600  ← Gamma 可写，但帧率腰斩，赛场不可接受
#   Mono8 165.369fps、YUV422 118.840fps         ← 均为黑白/压缩格式，不用
# 因此 gamma_* 在 RG8 下必然是"写了不生效"（GammaEnable/GammaSelector/Gamma 全部 0x80000106），
# 启动/重连时出现的 1~2 行 Gamma 告警属于预期现象，不是故障。
hk_camera:
  # 影像类参数以本文件为准（launch 里不要再写同名参数）。
  # 调参流程：先 roslaunch，再用 rqt_reconfigure 实时试值；试好后把最终值写回本文件，
  # 重启后即按本文件生效（rqt 只改运行中的值，不落盘）。
  #
  # gain_auto=true 时使用自动增益：上限取 gain_max(默认 16dB)，实测会顶到 16dB
  # （画面明显变亮、噪点增加）。gain_value 只在 gain_auto=false 时生效。
  gain_value: 13.0
  gain_auto: true
  gain_min: 0.0
  gain_max: 16.0
  # gamma_selector: 0=Gamma_auto(按 sRGB) 1=Gamma_user(用 gamma_value) 2=Gamma_off；
  # 见文件头说明：RG8 下三种取值都写不进去，保持与原 launch 一致的历史取值即可。
  gamma_selector: 0
  gamma_value: 0.7
  # exposure_auto=false 时用 exposure_value=200us；exposure_max/min 仅在 exposure_auto=true 时生效
  # （注意 cfg/camera.cfg 允许的窗口为 [20,30000]，写窗口外的值会被静默钳位到边界）。
  exposure_auto: false
  exposure_value: 200.0
  exposure_max: 20
  exposure_min: 20
  # 特殊模式曝光(us)：exposure_status_switch 服务 target=true 时使用（风车/特写等），
  # target=false 时恢复 exposure_value。不写此项时取代码默认 2000。
  exposure_value_windmill: 2000.0
  # 白平衡：reconfigCB 里无条件把 BalanceWhiteAuto 设为 OFF（见 "Black level Can not be used" 段），
  # 所以 white_auto 实际不生效，画面偏色属预期；white_selector 决定写哪个通道的 BalanceRatio。
  white_auto: false
  white_selector: 0
  # 降频话题 /hk_camera/image_raw_down 的总开关（由动态参数 is_fps_down/target_fps 控制）
  is_fps_down: false
